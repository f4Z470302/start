name: Build 5k+ medicines dataset
on:
  push:
    paths:
      - 'medicine-dataset/**'
  workflow_dispatch:
    inputs:
      min_rows:
        required: false
        default: "5000"
  schedule:
    - cron: "17 2 * * 0"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MIN_ROWS: ${{ github.event.inputs.min_rows || '5000' }}
      MAX_ROWS: "10000"
      REQUEST_DELAY_SECONDS: "1.0"
      SOURCE_BASE: "https://www.1mg.com"
      SOURCE_NAME: "tata_1mg"
      OUT_CSV: "data/medicines_dataset.csv"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r medicine-dataset/requirements.txt
      - working-directory: medicine-dataset
        run: python -m unittest discover -s tests -v
      - working-directory: medicine-dataset
        run: python scripts/build_dataset.py --min-rows "$MIN_ROWS"
      - run: |
          python - <<'PY'
          import pandas as pd
          p="medicine-dataset/data/medicines_dataset.csv"; d=pd.read_csv(p)
          assert len(d)>=5000
          assert d.id.is_unique and d.source_url.is_unique
          assert (d.price_inr>0).all()
          print("validated",len(d),"rows",len(d.columns),"columns")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: medicines-dataset-${{ github.run_number }}
          path: medicine-dataset/data/medicines_dataset.csv
          retention-days: 30
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medicine-dataset/data/medicines_dataset.csv
          git diff --cached --quiet || git commit -m "data: refresh medicines dataset"
          git push
